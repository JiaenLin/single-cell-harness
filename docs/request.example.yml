# A request: one cohort, every stage (harness W041). SYNTHETIC: every name below is a placeholder.
# A real request is data that lives with the cohort, never in this repository. The schema is
# sch/drive.py (FIELDS); `sch plan --request FILE` checks one and runs nothing, and
# `sch run --request FILE --out DIR` runs it, stopping before any stage whose adapter declares a choice
# as the user's until it is answered with `--answer NAME=VALUE --by WHO`.
request: 1
observations: samplesheet.tsv        # the QC tool's samplesheet: one row per library (relative to this file)
parts: ambient_h5                    # the samplesheet's column naming each library's object
keys: {sample: sample, condition: condition}
design: design.csv
context:                             # what the dataset is, declared once; one word per fact
  assay: snrna                       # scrna | snrna, and no other spelling; never a default (rule 2)
  species: species_x                 # one axis for the species; each adapter writes its tool's word
  tissue: tissue_x
upstream:                            # the steps the family does not perform, each by name
  alignment: {tool: cellranger, version: "7.1.0"}   # one tool's plain name and its release; any name the first
                                                    # stage's tool accepts (qc@scqc's upstream_accepts: any)
  ambient: {tool: cellbender, version: "0.3.0"}     # as the samplesheet's ambient_* columns say; `none` if nothing
                                                    # ran. On scrna the family never performs it, and cells
                                                    # delivered denoised, by any remover, stop at the user's
                                                    # upstream.ambient (the profile's ask_when_delivered, D-031)
stages:                              # in order; params are each tool's own flags, verbatim
  - plugin: qc@scqc
    params: {scqc: /path/to/scQC/scqc_cli.py, registry: /path/to/registry.tsv}
  - plugin: anno@scanno
    params:
      scanno: /path/to/scAnno/bin/scanno
      cluster: {resolutions: "0.5,1.0"}
      annotate: {cluster_key: [leiden_0p5, leiden_1p0], tree: /path/to/tree.json, species: species_x, tissue: tissue_x}
      embed: {label_obs: ["scanno_cell_type=cell_type"]}
  - plugin: int@scintegrate
    params:
      scintegrate: /path/to/scIntegrate
      integrate: {batch_key: sample, label_key: cell_type, design: /path/to/design.csv, methods: "none,harmony"}
  - plugin: prof@scprofile
    params:
      scprofile: /path/to/scProfile
      # the library column is not repeated here: the driver writes keys.sample into each tool's own flag
      run: {kernel: "de,abundance", label_key: cell_type, batch_key: sample, embedding: X_harmony}
resources:                             # the cohort's sizes; on pbs the site file's pbs.queues picks each queue
  drive: {ncpus: 2, mem: 16gb, walltime: "12:00:00"}
  qc: {ncpus: 8, mem: 64gb, walltime: "12:00:00"}

# ONE OBJECT HOLDING EVERY LIBRARY (harness W045), as public atlases deliver a cohort: `observations`
# names the .h5ad, and the driver runs the parts step as stage 00 - one read-only part per library,
# the counts unchanged, and the samplesheet the first stage mounts. Every name is the request's:
#   observations: atlas.h5ad
#   parts: matrix                          # the samplesheet column each part's path is written into
#   object:
#     counts: raw/X                        # the slot holding the integer counts (X, raw/X, layers/<name>)
#     symbols: symbol_x                    # the column of that slot's genes naming each gene's symbol
#     carry: [arm_x]                       # further obs columns carried into every part
#   keys: {sample: library_x, replicate: donor_x}   # the library, and the unit the design is keyed on
#   resources: {parts: {ncpus: 2, mem: 8gb, walltime: "06:00:00"}}
