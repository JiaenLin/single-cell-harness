contract: "1.0"
profile: single-cell/1.0
name: anno@scanno
version: 0.1.0
summary: scAnno's annotation mounted as a layer of label columns the stack can take back - cluster, annotate each library at every rung, rescue
when_to_use: >
  the stack's observations are a cohort's libraries after QC - a parts manifest, each part one
  library's object - and you want scAnno's labels on them as a layer that unmounts, with scAnno's
  own record of every call it made kept beside the labels

class: method
layer: stack
reversible: true
state_version: 1
# The assays scAnno has declared rule sets for (scanno/assay.py). Which one a run is, is the
# stack's declaration (`--context assay=`), passed to annotate verbatim; there is no default.
assays: [scrna, snrna]

# What it reads and hands on (harness W041): libraries in, its labelled libraries out, and the
# joint object only when the stage declares scAnno's `embed`.
reads: libraries
hands_on: {libraries: null, joint: embed}
# The column naming each library, where scAnno takes it: `embed --sample-key`, which writes it
# from each library's name into a joint object that lacks it (scanno/embed.py). The driver
# writes the request's keys.sample here when `embed` is declared (harness W042, GAP-C92).
library_key: embed.sample_key
# The context's facts scAnno takes as its own flags: a stage that states one differently is refused by
# the driver (harness W042 fix 1); the same word, stated twice, is the same fact.
context_params: {species: annotate.species, tissue: annotate.tissue}
# The escapes scAnno declares as the user's (`scanno describe` escapes[], scanno/cli.py:3227-3231): each
# lifts one of scAnno's refusals, so the driver passes it only as an answer recorded with who gave
# it, never as a plain param; unanswered, the flag is not passed - scAnno's own default (harness W042
# fix 1, D).
decisions:
  - name: no_exclude
    param: annotate.no_exclude
    escape: "--no-exclude"
    unanswered: tool-default
    what: "lifts the upstream exclusion: flagged observations are annotated"
  - name: background_from_clusters
    param: annotate.background_from_clusters
    escape: "--background-from-clusters"
    unanswered: tool-default
    what: "lifts the calibrated store: the background is read from the clusters"
  - name: gap_min
    param: annotate.gap_min
    escape: "--gap-min"
    unanswered: tool-default
    what: "lifts the descent threshold"
  - name: tissue_fallback
    param: annotate.tissue_fallback
    escape: "--tissue-fallback"
    unanswered: tool-default
    what: "lifts the declared tissue: every tissue of the species is read"
  - name: marker_species
    param: annotate.marker_species
    escape: "--marker-species"
    unanswered: tool-default
    what: "lifts the declared species, for markers only"

# scAnno reads the stack's parts manifest and nothing of what ran upstream (autodev W042 fix 2, A).
upstream_columns: {}
# The flags this adapter sets itself (run.py OWNED, tied by a test): refused when the plan is made.
owned: [cluster.h5ad, cluster.out, cluster.out_dir, cluster.split_by, cluster.status_dir, annotate.h5ad, annotate.assay, annotate.out, annotate.out_h5ad, annotate.report, annotate.status_dir, rescue.h5ad, rescue.out_dir, rescue.out, rescue.out_table, rescue.out_report, rescue.status_dir, embed.h5ad, embed.out, embed.status_dir]
wraps:
  tool: scAnno
  version: "0.12.0"
  homepage: https://github.com/JiaenLin/scAnno
  license: MIT
  cite: "Lin J. scAnno: hierarchical cell-type annotation that truncates rather than guesses. Software, version 0.12.0."
  state_version: 1

inject: [dataset]
needs: [observations/raw]
provides:
  - column/*
  - table/*
  - object/*
optional: []
sourceable: []
sees: []

language: python
entry: run.py
needs_env: false
executor: {cost: high}
invariant: invariant.py

cannot_show:
  - A label is the best-supported node of the declared tree for a cluster's markers; it is not evidence that the cell type is present, and a tree that lacks the right type yields the nearest wrong one.
  - UNRESOLVED and EXCLUDED are sentinels, not cell types; a forced or rescued label is an assignment the walk did not reach, and its own columns say so per observation.
  - The layer is what scAnno changed in the observations' annotation; a column the libraries already carried with the same values is the observation's own and is not in it, whatever scAnno recomputed.
  - Every library is clustered on its own; a cluster id means nothing across libraries, and agreement between them is a property of the labels, not of the partitions.
  - The scope, store, tree and corpus are references the stage declares; this mount runs no vote and builds no background, so the labels are only as portable as those references are.
  - Labels are over the observations the stack holds; a removal upstream that was differential across the design is a differential composition here, and nothing in this mount can undo it.
