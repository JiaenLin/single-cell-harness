contract: "1.0"
profile: single-cell/1.0
name: int@scintegrate
version: 0.1.0
summary: scIntegrate's integration mounted as a layer the stack can take back - every embedding, graph and column scIntegrate adds to the cohort's joint object
when_to_use: >
  the stack's observations are a cohort's joint object - its libraries already in one file, the one
  part of a parts manifest - and you want scIntegrate's methods compared, its benchmark run and its
  embeddings and graphs on the observations as a layer that unmounts, with scIntegrate's own record
  of the run kept beside them

class: method
layer: stack
reversible: true
state_version: 2
# The assays scIntegrate accepts (scintegrate/axes.py ASSAYS; `scintegrate describe`). No rule there
# differs by assay; which one a run is, is the stack's declaration (`--context assay=`), passed to
# integrate verbatim. There is no default.
assays: [scrna, snrna]

# What it reads and hands on (harness W041): the joint object in, scIntegrate's object out.
reads: joint
hands_on: {joint: null}
# The design sheet's column naming each library, where scIntegrate takes it; the driver writes
# the request's keys.sample here (harness W042, GAP-C92).
library_key: integrate.design_sample_col
# The escapes scIntegrate declares as the user's (`scintegrate describe` escapes[]; 2fc7a6c cli.py:1625-1629):
# each passed only as an answer recorded with who gave it (harness W042 fix 1, D); unanswered, nothing is
# withheld, and the PCA is refitted without the withheld cells (W039's default). The second arrived with
# scIntegrate 0.7.0, which this adapter means since W052; the driver's adapter met it at the merge (W056).
decisions:
  - name: drop_labels
    param: integrate.drop_labels
    escape: "withholding labels from the integration"
    unanswered: tool-default
    what: "the labels whose cells are withheld from the integration (comma-separated), or null"
  - name: keep_input_pca
    param: integrate.keep_input_pca
    escape: "fitting on the input's PCA although withheld cells are in it"
    unanswered: tool-default
    what: "true to fit on the input's own PCA although withheld cells are in it (recorded in report.json pca)"
# The design sheet scIntegrate reads keyed on that library column (`--design`, scintegrate/inputs.py
# read_design: one row per batch). A request whose design is keyed on a replicate a pooled library
# shares cannot be joined there: the driver refuses it before any tool (harness W045).
library_design: [integrate.design]

# The flags this adapter sets itself (run.py OWNED, tied by a test): refused when the plan is made.
owned: [integrate.h5ad, integrate.out, integrate.species, integrate.assay]
# The param naming the tool itself: the checkout holding it is in the run's set (autodev W049, route 14).
tool_param: scintegrate
wraps:
  tool: scIntegrate
  version: "0.7.0"
  homepage: https://github.com/JiaenLin/scIntegrate
  license: MIT
  cite: "Lin J. scIntegrate: is integration needed, which method, and one object carrying the answer. Software, version 0.7.0."
  state_version: 2

inject: [dataset]
needs: [observations/raw]
provides:
  - embedding/*
  - graph/*
  - column/*
  - table/*
  - object/*
optional: []
sourceable: []
sees: []

language: python
entry: run.py
needs_env: false
executor: {cost: high}
invariant: invariant.py

cannot_show:
  - A default embedding is the method that ranked first on scIB's total over chosen weights and chosen metrics; it is not evidence that the batch effect it removed was technical.
  - A factor nested in or aliased with the batch key is removed by construction, not measured; scIntegrate's constraint on use, in its report, says which claims the corrected embedding cannot carry.
  - Cells withheld from the fit carry NaN in every embedding of the layer; any count over an embedding excludes them, and any share is over the cells that remained.
  - The layer is what scIntegrate changed in the joint object; an embedding, graph or column the object already carried with the same values is the observation's own and is not in it, whatever scIntegrate copied.
  - The labels scored against are the annotation's, inherited; nothing in this mount shows they are correct, and every limit of the stage that wrote them applies here.
  - The embeddings are over the observations the stack holds; a removal upstream that was differential across the design shaped the space they sit in, and nothing in this mount can undo it.
