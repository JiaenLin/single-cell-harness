contract: "1.0"
profile: single-cell/1.0
name: mask_floor
version: 0.1.0
summary: mask observations whose total {counts} fall below a declared floor — a reversible removal
when_to_use: >
  you want a count floor applied as a decision that can be removed later, with every plugin
  above it knowing when it is

class: method
layer: stack
reversible: true
state_version: 1

inject: [dataset]
needs: ["matrix/{counts}"]
provides: [mask/count_floor, table/removal_record]
optional: []
sourceable: []
sees: []

language: python
entry: run.py
needs_env: true
executor: {cost: low}
gates: {differential_check: required}
invariant: invariant.py

cannot_show:
  - An observation passing the floor is one whose total fell above a number, not one that is intact.
  - The floor is declared, not derived; a floor that sits above the valley of most libraries removes real observations and reports it as quality.
  - A removal rate that differs across arms of the design is a technical property converted into an apparent difference; the gate measures it, this plugin does not correct it.
