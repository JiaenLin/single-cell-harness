contract: "1.0"
profile: single-cell/1.0
name: qc@scqc
version: 0.1.0
summary: scQC's quality control mounted as a reversible removal - one mask per criterion over the libraries the stack declares
when_to_use: >
  the stack's observations are a cohort's libraries - a parts manifest that is scQC's own
  samplesheet, each part the library's object at the floor (the denoised object an ambient
  checkpoint delivered, or the aligner's call) - and you want scQC's decision mounted so that it
  can be taken back, with every plugin above it knowing when it is

class: method
layer: stack
reversible: true
state_version: 1

# What it reads and hands on (harness W041): the stack's libraries; scQC's per-library objects
# (annotation reads them) and its joint deliverable (integration and DE read it).
assays: [scrna, snrna]
reads: libraries
hands_on: {libraries: null, joint: null}
# The choices scQC declares as the user's (`scqc describe` escapes): the driver asks them by name.
decisions:
  - name: mode
    param: mode
    escape: "the apply step"
    what: "evidence (measure, remove nothing) or apply (remove what scQC's gates allow); scQC's escape for the apply step"
  - name: decisions
    param: decisions
    escape: "a DERIVED threshold"
    what: "scQC's approved-threshold record (decisions.yml), or null; a derived threshold is applied only with a recorded human decision"

# scQC's escapes the driver passes nothing for, each with why (`scqc describe` escapes[]).
escapes_not_asked:
  "a REVIEW finding": "scQC proceeds and keeps the finding in gates[]; no decision is recorded against it"
# Where scQC's samplesheet says what ran upstream (scQC engine/graph.py: a library with a non-empty
# `ambient_h5` arrives already denoised, by `ambient_tool` at `ambient_version`, with its params and who
# produced it; `ambient_skip_*` declares the step declined; engine/steps.py NOT_FACTORS). The driver reads
# every row and refuses a request whose upstream block says otherwise (autodev W042 fix 2, A).
upstream_columns:
  ambient:
    tool: ambient_tool
    version: ambient_version
    performed: [ambient_h5, ambient_params, ambient_produced_by]
    declined: [ambient_skip_reason, ambient_skip_approved_by]
# WHAT scQC ACCEPTS AS PERFORMED UPSTREAM OF EACH ASSAY (autodev W049), read from scQC's own code and
# held by a drift test (tests/test_the_driver_follows_the_tools.py; the real scQC with SCH_REAL_TOOLS):
# an aligner by any name - scQC reads the matrix an aligner wrote (`matrix`, `aligner_cells`) and no
# column naming an aligner (engine/steps.py NOT_FACTORS) - and an ambient remover by any name, a
# library supplied denoised with its provenance (modules/01_ambient/ambient.py plan_ambient, SUPPLIED:
# tool, version, params, produced_by; one missing is a refusal), on both of its ASSAYS. Rule 2 over it
# is the profile's (never_performed, ask_when_delivered), never this list's.
upstream_accepts:
  scrna: {alignment: any, ambient: any}
  snrna: {alignment: any, ambient: any}
# The params with which scQC performs an upstream step itself, the tool each runs, and the assays scQC's
# own policy runs it on (modules/01_ambient/ambient.py CELLBENDER_RUNS; drift-tested): set on any other
# assay, or where the profile says the family never performs the step, the driver refuses them.
runs_upstream:
  ambient:
    - {param: cellbender, tool: CellBender, assays: [snrna]}
# The param naming scQC itself: the checkout holding it is in the run's set (autodev W049, route 14).
tool_param: scqc
# WHAT scQC OPENS, DECLARED (autodev W056, design read D6; PLUGIN_FORMAT `files:`): a run depends on exactly these and
# on the request's and the site's own files; every other flag is text (scqc_cli.py:605-647 parses them and opens
# none). Each entry cites scQC 8106f50's line that opens it, from its working directory, the stage's run directory.
files:
  scqc: {kind: checkout}                   # scqc_cli.py, which run.py runs (:135, :148)
  registry: {kind: file}                   # modules/00_ingest/ingest.py:193 reads it; its path column (:198) is never
                                           # opened (only `ref not in registry`, :132): a leaf, its cells text
  decisions: {kind: file}                  # engine/decisions.py:60 (apply mode); no key of it names a file
  python: {kind: path, check: present}     # an interpreter: adapters/matrix.py:1575, adapters/scanpy_ops.py:2192
  rscript: {kind: path, check: present}    # adapters/doublets.py:1266
  cellbender: {kind: path, check: present} # adapters/cellbender.py:755
  celescope: {kind: path, check: present}  # the align route: adapters/celescope.py:1112
  cellranger: {kind: path, check: present} # the align route: adapters/cellranger.py:841
  # the samplesheet's cells scQC opens, each as written, from its working directory: matrix (ingest.py:162),
  # ambient_h5 (engine/steps.py:496, :508), aligner_cells (steps.py:788), cellbender_barcodes (adapters/
  # cellbender.py:1284, steps.py:793), cellreads_stats (adapters/nuclear_fraction.py:114), fastq_r1 (the align
  # route: adapters/celescope.py:1049), ambient_log and ambient_metrics (steps.py:655). `reference` is a registry
  # key (ingest.py:132) and, on the align route only, a folder (steps.py:1135): not declared, a stated limit
  observations:
    names: {format: table, relative_to: none, each: {kind: path},
            at: [matrix, ambient_h5, aligner_cells, cellbender_barcodes, cellreads_stats, fastq_r1, ambient_log,
                 ambient_metrics]}
# The flags this adapter sets itself (run.py OWNED, tied by a test): refused when the plan is made.
owned: [project, samplesheet]
wraps:
  tool: scQC
  version: "0.4.0"
  homepage: https://github.com/JiaenLin/scQC
  license: MIT
  cite: "Lin J. scQC: a reproducible quality-control pipeline for single-cell and single-nuclei RNA-seq. Software, version 0.4.0."
  state_version: 1

inject: [dataset]
needs: [observations/raw]
provides:
  - mask/fail_*
  - column/total_counts
  - column/n_genes
  - column/pct_counts_mt
  - column/pct_counts_ribo
  - column/nuclear_fraction
  - column/doublet_score
  - column/doublet_class
  - table/*
  - object/*
optional: []
sourceable: []
sees: [design]

language: python
entry: run.py
needs_env: false
executor: {cost: high}
gates: {differential_check: required}
invariant: invariant.py

cannot_show:
  - An observation passing QC is not an observation that is intact; it is one whose summary statistics fell inside thresholds scQC derived or was given.
  - A threshold is a finding about ONE cohort's distributions; nothing in this mount establishes that it transfers to another cohort.
  - The denoised matrix beneath this mount is a checkpoint, read as delivered; no check here can tell a well-removed ambient transcript from a badly-removed real one.
  - The differential check this mount passes is the harness's, over the stack's declared design; scQC's own design-aware checks ran over its samplesheet's factor columns and are in its report, not in this gate.
  - A called doublet is a barcode the detector scored high; without hashing or genotypes no call here is a verified doublet.
