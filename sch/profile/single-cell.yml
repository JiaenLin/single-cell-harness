# Profile: single-cell — binds the contract to single-cell and single-nucleus data.
# Prose specification: docs/profiles/single-cell.md. This file is what the kernel reads.
profile: single-cell/1.0
observation: one barcode, a cell or a nucleus
identity:
  column: barcode
  scope: "{sample}"           # barcodes are unique only within a sample
  # How a scoped identity is written when observations arrive as one part per sample (harness
  # W010): `<sample>|<barcode>`, the form the QC tool's own removal ledger keys on. A sample name
  # carrying the joiner is refused, so the first joiner always splits the two.
  joiner: "|"
materialiser: h5ad
missing: NaN

slots:
  column:         {dir: columns,    format: csv, fields: [barcode, value],        binds: obs}
  feature_column: {dir: features,   format: csv, fields: [feature, value],        binds: var}
  embedding:      {dir: embeddings, format: npy, identity: barcodes.txt,          binds: obsm}
  matrix:         {dir: matrices,   format: npz,                                  binds: layers}
  graph:          {dir: graphs,     format: npz, identity: barcodes.txt,          binds: obsp}
  mask:           {dir: masks,      format: csv, fields: [barcode, keep, reason]}
  object:         {dir: objects,    format: h5ad}
  table:          {dir: tables}
  figure:         {dir: figures}
  answer:         {dir: answers}

keys: [label, sample, batch, counts, lognorm, embedding, compartment]

# COHORT AXES (harness ADR-0027): what makes one dataset differ from another before any biology.
# A tool may be TOLD each of these, and may infer some from the data; it may never ASSUME one.
# `sch conform` S13 refuses a literal default for any of them, in any repository. The case that
# put this here: scQC's mitochondrial step read `params.get("assay", "snrna")` from a task that
# was never given `assay`, so every cohort got the first cohort's assay - and no test could see
# it, because on the first cohort the default and the truth were the same word.
axes: [species, organism, assay, platform, chemistry, mt_prefix, ribo_pattern, reference, genome, tissue]

capabilities:
  "capability:embedding": embedding/*
  "capability:labels":    column/{label}
  "capability:mask":      mask/*
  "capability:counts":    matrix/{counts}

sentinels: [EXCLUDED, UNRESOLVED]
checkpoint_kinds: [align, ambient, impute, "integrate:corrected-counts"]

# THE STEPS THE FAMILY DOES NOT PERFORM, DECLARED BY NAME (harness W041): a request names the tool
# that aligned the libraries and the tool that removed ambient RNA (`tool: none` is a declaration).
# `allowed` is rule 2 (the PI, 2026-10-02: "do not run cellbender for single cell"; a remover
# calibrated on nuclei is not lent to cells), written as what MAY run, never as what may not: a
# step an assay lists here takes only the names listed (compared trimmed and case-folded, nothing
# else), so no spelling of a nucleus-calibrated remover - its name with a version, its command -
# reaches single cells. A remover made for cells enters by a reviewed line here, with its evidence.
# An assay or a step not listed takes any declared name (single nuclei: CellBender is theirs).
upstream:
  steps: [alignment, ambient]
  allowed:
    scrna: {ambient: [none]}

required:
  mask:
    gates: {differential_check: required}

reserved_identifiers:
  - cell_type
  - cell_type_forced
  - sample
  - batch
  - leiden
  - louvain
  - X_umap
  - X_pca
  - X_scanvi
  - counts
  - lognorm
  - scanno_cell_type

# Terms sch doctor forbids under sch/core and sch/registry (L2).
domain_terms:
  - cell
  - gene
  - barcode
  - assay
  - nucleus
  - nuclei
  - umi
  - obs_names
  - anndata
  - h5ad
  - scanpy
  - seurat
  - transcript
  - mitochond
  - ribosom
  - doublet
